<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InvoiceTracker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>InvoicePriceTracker</title>
  </head>
  <body>
    <script>
      (() => {
        const authKey = 'invoicePriceTrackerAuth';
        const authTokenKey = 'authToken';
        const legacyKeys = ['token', 'user', 'company', 'companyId', 'invoicePriceTrackerLoggedOut'];
        try {
          const session = JSON.parse(localStorage.getItem(authKey) || 'null');
          const company = session && session.company ? session.company : {};
          const user = session && session.user ? session.user : {};
          const legacyCompanyId = ['demo', 'company'].join('-');
          const legacyUserId = ['demo', 'user'].join('-');
          const legacyUsername = ['de', 'mo'].join('');
          const legacyCompanyName = '\u6d4b\u8bd5\u516c\u53f8';
          const legacyMojibakeCompanyName = '\u5a34\u5b2d\u762f\u934f\ue100\u5f83';
          const authToken = localStorage.getItem(authTokenKey) || '';
          const invalidSession = session && (
            !session.token ||
            session.token !== authToken ||
            company.id === legacyCompanyId ||
            user.companyId === legacyCompanyId ||
            user.id === legacyUserId ||
            company.name === legacyCompanyName ||
            company.name === legacyMojibakeCompanyName ||
            user.username === legacyUsername
          );
          if (invalidSession) {
            localStorage.removeItem(authKey);
            localStorage.removeItem(authTokenKey);
          }
          for (const key of legacyKeys) localStorage.removeItem(key);
        } catch {
          localStorage.removeItem(authKey);
          localStorage.removeItem(authTokenKey);
          for (const key of legacyKeys) localStorage.removeItem(key);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

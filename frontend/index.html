<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InvoiceTracker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>InvoicePriceTracker</title>
  </head>
  <body>
    <script>
      (() => {
        const authKey = 'invoicePriceTrackerAuth';
        const legacyKeys = ['authToken', 'token', 'user', 'company', 'companyId', 'invoicePriceTrackerLoggedOut'];
        try {
          const session = JSON.parse(localStorage.getItem(authKey) || 'null');
          const company = session && session.company ? session.company : {};
          const user = session && session.user ? session.user : {};
          const legacyDemo = session && (
            !session.token ||
            company.id === 'demo-company' ||
            user.companyId === 'demo-company' ||
            user.id === 'demo-user' ||
            company.name === '测试公司' ||
            user.username === 'demo'
          );
          if (legacyDemo) localStorage.removeItem(authKey);
          for (const key of legacyKeys) localStorage.removeItem(key);
        } catch {
          localStorage.removeItem(authKey);
          for (const key of legacyKeys) localStorage.removeItem(key);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
